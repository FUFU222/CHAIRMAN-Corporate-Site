<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow, noarchive" />
    <meta name="description" content="現在メンテナンス中です。" />
    <title>株式会社CHAIRMAN | メンテナンス中</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f4efe7;
        --panel: rgba(255, 255, 255, 0.88);
        --border: rgba(17, 24, 39, 0.12);
        --text: #111827;
        --muted: #5b6472;
        --accent: #8e1f2f;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background:
          radial-gradient(circle at top, rgba(142, 31, 47, 0.12), transparent 32%),
          linear-gradient(180deg, #f8f5ef 0%, var(--bg) 100%);
        color: var(--text);
        font-family:
          "Hiragino Mincho ProN",
          "Yu Mincho",
          "Noto Serif JP",
          serif;
      }

      main {
        width: min(100%, 720px);
        padding: 48px 40px;
        border: 1px solid var(--border);
        border-radius: 24px;
        background: var(--panel);
        box-shadow: 0 20px 80px rgba(17, 24, 39, 0.08);
        text-align: center;
      }

      .eyebrow {
        margin: 0 0 20px;
        color: var(--accent);
        font-size: 0.875rem;
        letter-spacing: 0.18em;
      }

      h1 {
        margin: 0 0 16px;
        font-size: clamp(2rem, 4vw, 3rem);
        line-height: 1.2;
      }

      p {
        margin: 0 auto;
        max-width: 32rem;
        color: var(--muted);
        font-size: 1rem;
        line-height: 1.8;
      }

      @media (max-width: 640px) {
        main {
          padding: 36px 24px;
          border-radius: 18px;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">SITE MAINTENANCE</p>
      <h1>ただいまメンテナンス中です</h1>
      <p>恐れ入りますが、しばらくしてから再度アクセスしてください。</p>
    </main>
  </body>
</html>
